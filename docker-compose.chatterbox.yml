# The whole stack: Chatterbox TTS server (./chatterbox) + the audiobook web UI (repo root).
# Two containers, one project. Copy .env.example to .env, set the paths, then:
#   docker compose -f docker-compose.chatterbox.yml up -d --build
# Web UI: http://localhost:7860 · Chatterbox UI/API: http://localhost:8004 (OpenAI API under /v1)
services:
  chatterbox:
    build:
      context: ./chatterbox
      dockerfile: Dockerfile
      args:
        - RUNTIME=nvidia
    image: chatterbox-tts-server:local
    container_name: chatterbox
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - HF_HUB_ENABLE_HF_TRANSFER=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - TTS_BF16=auto
      # Compiled T3 token loop (F-45): "on" compiles the per-token step with CUDA graphs at
      # model load for ~2.3x faster generation; off until validated (see .env.example).
      - TTS_COMPILE=${TTS_COMPILE:-off}
      # Whole-folder mount below (not a single-file one) so config saves can rename
      # instead of copying onto a mount point (F-52); host file path is unchanged.
      - CHATTERBOX_CONFIG_PATH=/app/data/config.yaml
    volumes:
      # Chatterbox's own settings file and voice clips live outside the repo. The whole
      # folder is mounted (not just config.yaml) so config.py's save can os.replace()
      # within it; a single-file bind mount can't be renamed onto (F-52), and a missing
      # host file used to make Docker create a directory in its place (F-24).
      - ${CHATTERBOX_DATA:?set CHATTERBOX_DATA in .env}:/app/data
      - ${CHATTERBOX_DATA}/voices:/app/voices
      - ${CHATTERBOX_DATA}/reference_audio:/app/reference_audio
      - ${CHATTERBOX_DATA}/outputs:/app/outputs
      - ${CHATTERBOX_DATA}/logs:/app/logs
      - hf-cache:/app/hf_cache  # downloaded models survive rebuilds
    ports:
      - ${CHATTERBOX_PORT:-8004}:8004
    networks:
      - tts
    healthcheck:
      # Model load takes ~12s once cached, but a first run also downloads the model
      # (several GB), hence the generous start_period. Reads MODEL_LOADED via the
      # same JSON /api/model-info returns to the UI (engine.get_model_info()).
      test: ["CMD", "python3", "-c", "import json,urllib.request,sys; d=json.load(urllib.request.urlopen('http://localhost:8004/api/model-info', timeout=5)); sys.exit(0 if d.get('loaded') else 1)"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 5m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu

  epub-to-audiobook:
    build: .
    image: epub_to_audiobook:local
    container_name: epub-to-audiobook
    restart: unless-stopped
    depends_on:
      chatterbox:
        condition: service_healthy
    command: ["--host", "0.0.0.0", "--port", "7860"]
    environment:
      - TZ=${TZ:-UTC}
      - OPENAI_BASE_URL=http://chatterbox:8004/v1
      # Chatterbox has no auth; the OpenAI SDK just needs a non-empty key.
      - OPENAI_API_KEY=not-needed
      # Voice dropdown and "Add a voice" use Chatterbox's voices folder directly.
      - TTS_VOICES_DIR=/voices
      - OPENAI_DEFAULT_VOICE=${DEFAULT_VOICE:-Emily.wav}
      # Voice lab reads Chatterbox's saved delivery settings from its config file.
      - CHATTERBOX_CONFIG=/chatterbox/config.yaml
      # Searchable "Book" picker lists this library.
      - EBOOK_LIBRARY_DIR=/library
      # Give the library manager's container user ownership of finished book folders/files.
      - AUDIOBOOK_OUTPUT_UID=${AUDIOBOOK_OUTPUT_UID:-}
      # Optional second engine. Leave unset (the default) to hide the Engine choice entirely.
      - KOKORO_BASE_URL=${KOKORO_BASE_URL:-}
      - KOKORO_DEFAULT_VOICE=${KOKORO_DEFAULT_VOICE:-}
      # Optional local LLM (OpenAI-compatible chat endpoint) for multi-voice cast analysis. Leave
      # LLM_BASE_URL unset (the default) to hide the Cast voice mode entirely.
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      # "off" keeps Chatterbox's model on the GPU during a cast analysis (default: unload it first).
      - LLM_UNLOAD_CHATTERBOX=${LLM_UNLOAD_CHATTERBOX:-on}
      # Machine listening for short Chatterbox takes: Whisper small on the CPU checks that each one
      # says its text (downloaded here once, about 480 MB). Set it empty to turn the check off.
      - SPEECH_CHECK_MODEL=${SPEECH_CHECK_MODEL-/app/models/faster-whisper-small}
    volumes:
      - ${APP_DATA:?set APP_DATA in .env}:/app                            # queue, library index, logs
      - ${AUDIOBOOK_LIBRARY:?set AUDIOBOOK_LIBRARY in .env}:/app/audiobook_output  # finished books
      - ${CHATTERBOX_DATA}/voices:/voices                                # writable: the Voice lab adds voices
      - ${CHATTERBOX_DATA}:/chatterbox:ro                                # for config.yaml
      - ${EBOOK_LIBRARY:?set EBOOK_LIBRARY in .env}:/library:ro
    ports:
      - ${APP_PORT:-7860}:7860
    networks:
      - tts

volumes:
  hf-cache:
    # Reuse an existing model cache by naming it here (avoids re-downloading several GB of models).
    name: ${HF_CACHE_VOLUME:-chatterbox-hf-cache}

networks:
  tts:
    name: ${DOCKER_NETWORK:-tts}
    external: true  # create once: docker network create tts (or reuse an existing network)
